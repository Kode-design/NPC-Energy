<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>NPC Energy: Chapter 1</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: 'Press Start 2P', monospace;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            border: 4px solid #333;
            max-width: 100vw;
            max-height: 100vh;
            aspect-ratio: 16 / 9;
        }

        canvas {
            display: block;
            image-rendering: pixelated; 
            width: 100%;
            height: 100%;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        #dialogue-box {
            background: #000;
            border-top: 4px solid white;
            padding: 20px;
            min-height: 160px;
            display: none; 
            pointer-events: auto;
            position: absolute;
            bottom: 0;
            width: 100%;
            box-sizing: border-box;
        }

        .char-name {
            color: #f0e68c;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .dialogue-text {
            color: white;
            font-size: 12px;
            line-height: 1.8;
            margin-bottom: 15px;
        }

        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: auto;
        }

        .choice-btn {
            background: #222;
            border: 2px solid #555;
            color: white;
            padding: 8px;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            width: 100%;
        }

        .choice-btn:hover {
            background: #444;
            border-color: #f0e68c;
            padding-left: 15px;
        }

        #interaction-prompt {
            position: absolute;
            bottom: 180px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            padding: 10px;
            border: 2px solid white;
            display: none;
            font-size: 10px;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translate(-50%, 0); }
            50% { transform: translate(-50%, -5px); }
        }
        
        #fade-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            opacity: 1;
            transition: opacity 1s;
            pointer-events: none;
        }

    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="450"></canvas>

        <div id="ui-layer">
            <div id="interaction-prompt">PRESS SPACE</div>

            <div id="dialogue-box">
                <div id="char-name" class="char-name">Timothy</div>

<script>
/**
 * NPC ENERGY - GAME ENGINE
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false; 

// --- SCENE MANAGEMENT ---
const SCENES = {
    HOME: 0,
    OUTSIDE: 1,
    HALLWAY: 2
};

let currentScene = SCENES.HOME;
let gameState = 'dialogue'; // Starts in dialogue
let frameCount = 0;

// --- INPUT ---
const keys = {
    ArrowRight: false,
    ArrowLeft: false,
    KeyD: false,
    KeyA: false,
    Space: false
};

window.addEventListener('keydown', (e) => {
    if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
        e.preventDefault();
    }
    if(e.code === 'Space') handleInteraction();
    if(keys.hasOwnProperty(e.code)) keys[e.code] = true;
});

window.addEventListener('keyup', (e) => {
    if(keys.hasOwnProperty(e.code)) keys[e.code] = false;
});

// --- CAMERA ---
const camera = { x: 0, y: 0 };

// --- SPRITE HELPERS ---
function drawPixelRect(ctx, x, y, width, height, color) {
    ctx.fillStyle = color;
    ctx.fillRect(Math.floor(x), Math.floor(y), width, height);
}

class Entity {
    constructor(x, y, width, height, color) {
        this.x = x;
        this.y = y;
        this.width = width;
        this.height = height;
        this.color = color;
        this.direction = 1; 
        this.isMoving = false;
        this.bobOffset = 0;
        this.visible = true;
    }

    draw(ctx, camX) {
        if (!this.visible) return;
        
        if (this.isMoving) {
            this.bobOffset = Math.sin(frameCount * 0.2) * 2;
        } else {
            this.bobOffset = 0;
        }

        const renderX = this.x - camX;
        const renderY = this.y + this.bobOffset;

        if (renderX < -100 || renderX > 900) return;

        this.drawSprite(ctx, renderX, renderY);
    }

    drawSprite(ctx, x, y) {
        ctx.fillStyle = this.color;
        ctx.fillRect(x, y, this.width, this.height);
    }
}

// --- CHARACTERS ---

class Timothy extends Entity {
    constructor(x, y) {
        super(x, y, 30, 58, '#3498db'); 
        this.speed = 3;
    }

    update() {
        if (gameState !== 'playing') {
            this.isMoving = false;
            return;
        }

        this.isMoving = false;
        if (keys.ArrowRight || keys.KeyD) {
            this.x += this.speed;
            this.direction = 1;
            this.isMoving = true;
        }
        if (keys.ArrowLeft || keys.KeyA) {
            this.x -= this.speed;
            this.direction = -1;
            this.isMoving = true;
        }
        
        // Scene Bounds
        if (this.x < 0) this.x = 0;
        if (currentScene === SCENES.HOME && this.x > 700) this.x = 700;
        if (currentScene === SCENES.HALLWAY && this.x > 3000) this.x = 3000;
    }

    drawSprite(ctx, x, y) {
        drawPixelRect(ctx, x + 5, y + 20, 20, 25, '#3498db'); 
        drawPixelRect(ctx, x + 5, y + 45, 20, 13, '#2c3e50'); 
        drawPixelRect(ctx, x + 2, y, 26, 20, '#f1c27d'); 
        drawPixelRect(ctx, x, y - 5, 30, 10, '#5d4037'); 
        ctx.fillStyle = '#000';
        if (this.direction === 1) ctx.fillRect(x + 15, y + 8, 8, 4);
        else ctx.fillRect(x + 5, y + 8, 8, 4);
        const bpX = (this.direction === 1) ? x - 4 : x + 24;
        drawPixelRect(ctx, bpX, y + 22, 10, 15, '#e67e22');
    }
}

class Khristopher extends Entity {
    constructor(x, y) {
        super(x, y, 48, 85, '#111'); 
    }

    update(targetX) {
        if (currentScene === SCENES.HOME) return; // Not in home scene

        const distance = targetX - this.x;
        const stopDistance = 70; 

        if (Math.abs(distance) > stopDistance) {
            this.x += Math.sign(distance) * 2.8; 
            this.direction = Math.sign(distance);
            this.isMoving = true;
        } else {
            this.isMoving = false;
        }
    }

    drawSprite(ctx, x, y) {
        drawPixelRect(ctx, x, y + 20, 48, 50, '#1a1a1a');
        drawPixelRect(ctx, x + 8, y + 68, 32, 17, '#0d0d0d');
        drawPixelRect(ctx, x + 4, y - 2, 40, 35, '#111');
        drawPixelRect(ctx, x + 10, y + 8, 28, 22, '#000'); 
        drawPixelRect(ctx, x + 16, y + 22, 16, 8, '#dcb'); 
        if (this.direction === 1) drawPixelRect(ctx, x + 18, y + 10, 2, 10, '#a33'); 
        else drawPixelRect(ctx, x + 28, y + 10, 2, 10, '#a33'); 
        drawPixelRect(ctx, x + 12, y + 55, 24, 3, '#333');
    }
}

// --- SCENE ASSETS ---
function drawHomeBackground(ctx) {
    ctx.fillStyle = '#d7bde2'; 
    ctx.fillRect(0, 0, 800, 350);
    ctx.fillStyle = '#a1887f'; 
    ctx.fillRect(0, 350, 800, 100);
    ctx.fillStyle = '#85c1e9';
    ctx.fillRect(100, 100, 150, 150);
    ctx.fillStyle = '#fff'; 
    ctx.fillRect(170, 100, 10, 150);
    ctx.fillRect(100, 170, 150, 10);
    ctx.fillStyle = '#5dade2';
    drawPixelRect(ctx, 400, 280, 200, 70, '#5dade2');
}

function drawOutsideBackground(ctx) {
    ctx.fillStyle = '#85c1e9';
    ctx.fillRect(0,0,800,500);
    ctx.fillStyle = '#fff';
    ctx.fillRect(100, 50, 80, 30);
    ctx.fillRect(500, 80, 120, 40);
    ctx.fillStyle = '#95a5a6';
    ctx.fillRect(0, 350, 800, 100);
    ctx.fillStyle = '#c0392b'; 
    ctx.fillRect(500, 150, 300, 200);
    ctx.fillStyle = '#2c3e50'; 
    ctx.fillRect(600, 250, 60, 100);
}

function drawHallwayBackground(ctx, camX) {
    ctx.fillStyle = '#7f8c8d';
    ctx.fillRect(0, 350, 800, 100);
    ctx.fillStyle = '#95a5a6';
    for (let i = 0; i < 800; i+= 40) {
        let worldX = i + (Math.floor(camX / 40) * 40) - (camX % 40);
        ctx.fillRect(worldX, 350, 20, 100);
    }
    const lockerWidth = 60;
    const startLocker = Math.floor(camX / lockerWidth);
    const endLocker = startLocker + 15;
    for (let i = startLocker; i < endLocker; i++) {
        let lx = (i * lockerWidth) - camX;
        ctx.fillStyle = '#34495e';
        ctx.fillRect(lx + 5, 100, 50, 250);
        ctx.fillStyle = '#2c3e50';
        ctx.fillRect(lx + 15, 120, 30, 5);
        ctx.fillRect(lx + 15, 130, 30, 5);
        ctx.fillRect(lx + 15, 140, 30, 5);
        ctx.fillStyle = '#95a5a6';
        ctx.fillRect(lx + 45, 220, 5, 10);
    }
}

    NPC_FREDDY: [
        { speaker: 'Freddy', text: "Watch it, dweeb." },
        { speaker: 'Timothy', text: "Sorry, Freddy." },
        { speaker: 'Freddy', text: "Keep walking. The air around you is depressing." }
    ],

    // ENDING
    LOCKER_FOUND: [
        { speaker: 'Timothy', text: "Finally. Locker 404. Found it." },
        { speaker: 'Khristopher', text: "Locker not found. Joke." },
        { speaker: 'Timothy', text: "Very funny." },
        { speaker: 'Timothy', text: "Well, I survived the morning. Maybe I'm not just an NPC." },
        { speaker: 'System', text: "CHAPTER 1 COMPLETE" },
        { speaker: 'System', text: "Thanks for playing!" }
    ]
};

// --- GAME OBJECTS ---
const player = new Timothy(150, 300);
const mom = new Mom(300, 300);
const car = new Car(400, 290);
const follower = new Khristopher(100, 300);
const weirdGirl = new Tuesday(50, 300);

// Hallway Objects
const freddy = new Freddy(1800, 280); 
const daniel = new Daniel(700, 290);
const mindy = new Mindy(750, 295);
const roamingNPCs = [
    new Weeb(400, 300),
    new OddGirl(1000, 305),
    new GenericStudent(500, 300),
    new GenericStudent(1100, 300),
    new GenericStudent(1500, 300)
];
const targetLocker = new Locker(2800, 350);

// --- LOGIC ---
let dialogueQueue = [];
let interactionActive = false;
let sceneTriggered = false;
let pendingInteraction = null; // Stores the interaction function if player presses space

// NOTE: Initial start call moved to end of script to wait for UI init

function changeScene(newScene) {
    if (sceneTriggered) return;
    sceneTriggered = true;

    const overlay = document.getElementById('fade-overlay');
    overlay.style.opacity = 1;
    
    setTimeout(() => {
        currentScene = newScene;
        
        // Reset Positions based on scene
        if (newScene === SCENES.OUTSIDE) {
            player.x = 250;
            follower.x = 350; 
            weirdGirl.x = 100; 
            startDialogue(SCRIPTS.OUTSIDE_MEET);
        } else if (newScene === SCENES.HALLWAY) {
            player.x = 50;
            follower.x = 10;
            weirdGirl.x = -50;
            startDialogue(SCRIPTS.HALLWAY_INTRO);
        }
        
        setTimeout(() => {
            overlay.style.opacity = 0;
            sceneTriggered = false; 
        }, 100);
    }, 1000);
}

function update() {
    frameCount++;
    player.update();

    if (currentScene === SCENES.HOME) {
        if (dialogueQueue.length === 0 && !interactionActive && keys.ArrowRight && player.x > 600) {
             changeScene(SCENES.OUTSIDE);
        }
    } 
    else if (currentScene === SCENES.OUTSIDE) {
        follower.update(player.x);
        weirdGirl.update(follower.x);
        
        if (dialogueQueue.length === 0 && !interactionActive && player.x > 750) {
            changeScene(SCENES.HALLWAY);
        }
    }
    else if (currentScene === SCENES.HALLWAY) {
        follower.update(player.x);
        weirdGirl.update(follower.x);
        daniel.update();
        mindy.update();
        roamingNPCs.forEach(npc => npc.update());
        
        checkInteractions();

        camera.x = player.x - 200;
        if (camera.x < 0) camera.x = 0;
    }
}

function checkInteractions() {
    if (gameState !== 'playing') return;

    let interactionFound = false;
    const interactionDist = 60;

    // Check Freddy
    if (Math.abs(player.x - freddy.x) < interactionDist) {
        uiPrompt.innerText = "PRESS SPACE";
        uiPrompt.style.display = 'block';
        pendingInteraction = () => startDialogue(SCRIPTS.NPC_FREDDY);
        interactionFound = true;
    }
    // Check Locker
    else if (Math.abs(player.x - targetLocker.x) < interactionDist) {
        uiPrompt.innerText = "OPEN LOCKER";
        uiPrompt.style.display = 'block';
        pendingInteraction = () => startDialogue(SCRIPTS.LOCKER_FOUND);
        interactionFound = true;
    }
    else {
        // Check NPCs
    const allNPCs = [...roamingNPCs, mindy];
    for (let npc of allNPCs) {
             if (Math.abs(player.x - npc.x) < interactionDist) {
                uiPrompt.innerText = "TALK";
                uiPrompt.style.display = 'block';
                if (npc instanceof Weeb) pendingInteraction = () => startDialogue(SCRIPTS.NPC_WEEB);
                else if (npc instanceof OddGirl) pendingInteraction = () => startDialogue(SCRIPTS.NPC_ODDGIRL);
                else pendingInteraction = () => startDialogue(SCRIPTS.NPC_GENERIC);

                interactionFound = true;
                break;
             }
        }
    }

    if (!interactionFound) {
        uiPrompt.style.display = 'none';
        pendingInteraction = null;
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (currentScene === SCENES.HOME) {
        drawHomeBackground(ctx);
        mom.draw(ctx, 0);
        player.draw(ctx, 0);
    } 
    else if (currentScene === SCENES.OUTSIDE) {
        drawOutsideBackground(ctx);
        car.draw(ctx, 0);
        player.draw(ctx, 0);
        follower.draw(ctx, 0);
        weirdGirl.draw(ctx, 0);
    }
    else if (currentScene === SCENES.HALLWAY) {
        drawHallwayBackground(ctx, camera.x);
        roamingNPCs.forEach(npc => npc.draw(ctx, camera.x));
        daniel.draw(ctx, camera.x);
        mindy.draw(ctx, camera.x);
        weirdGirl.draw(ctx, camera.x);
        follower.draw(ctx, camera.x);
        player.draw(ctx, camera.x);
        freddy.draw(ctx, camera.x);
    }
}

// --- DIALOGUE SYSTEM ---
const uiDialogue = document.getElementById('dialogue-box');
const uiName = document.getElementById('char-name');
const uiText = document.getElementById('dialogue-text');
const uiChoices = document.getElementById('choices');
const uiPrompt = document.getElementById('interaction-prompt');

let currentDialogueLine = null;
let typeInterval = null;
let currentFullText = "";
let isTyping = false;

function startDialogue(dialogueArray) {
    gameState = 'dialogue';
    dialogueQueue = [...dialogueArray];
    uiDialogue.style.display = 'block';
    showNextLine();
}

function showNextLine() {
    if (dialogueQueue.length === 0) {
        endDialogue();
        return;
    }

    currentDialogueLine = dialogueQueue.shift();
    const line = currentDialogueLine;
    uiChoices.innerHTML = ''; 

    // Colors
    let color = '#fff';
    if(line.speaker === 'Timothy') color = '#3498db';
    if(line.speaker === 'Mom') color = '#8e44ad';
    if(line.speaker === 'Khristopher') color = '#95a5a6';
    if(line.speaker === 'Tuesday') color = '#bdc3c7';
    
    uiName.style.color = color;
    uiName.innerText = line.speaker;

    // Start Typewriter
    uiText.innerText = "";
    currentFullText = line.text;
    isTyping = true;
    let charIndex = 0;

    if (typeInterval) clearInterval(typeInterval);

    uiPrompt.style.display = 'none'; // Hide prompt while typing
    interactionActive = false;

    typeInterval = setInterval(() => {
        uiText.innerText += currentFullText[charIndex];
        charIndex++;
        if (charIndex >= currentFullText.length) {
             finishTyping();
        }
    }, 20); // Typing speed
}

function finishTyping() {
    clearInterval(typeInterval);
    isTyping = false;
    uiText.innerText = currentFullText;

    const line = currentDialogueLine;
    if (line.choices) {
        // Render Choices
        line.choices.forEach(choice => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.innerText = choice.text;
            btn.onclick = (e) => {
                e.stopPropagation(); // Prevent spacebar interaction
                handleChoice(choice.outcome);
            };
            uiChoices.appendChild(btn);
        });
        interactionActive = false;
    } else {
        interactionActive = true;
        uiPrompt.style.display = 'block';
    }
}

function handleChoice(outcome) {
    // Append the outcome script to the front of the queue
    let nextLines = [];
    
    if (outcome === 'bitter') nextLines = SCRIPTS.HOME_BITTER;
    if (outcome === 'resigned') nextLines = SCRIPTS.HOME_RESIGNED;
    if (outcome === 'ironic') nextLines = SCRIPTS.HOME_IRONIC;
    
    if (outcome === 'humor') nextLines = SCRIPTS.OUTSIDE_HUMOR;
    if (outcome === 'defense') nextLines = SCRIPTS.OUTSIDE_DEFENSE;
    
    if (outcome === 'stealth') nextLines = SCRIPTS.HALLWAY_STEALTH;
    if (outcome === 'strut') nextLines = SCRIPTS.HALLWAY_STRUT;
    
    // Add to queue
    dialogueQueue = [...nextLines, ...dialogueQueue];
    showNextLine();
}

function handleInteraction() {
    if (gameState === 'dialogue') {
        if (isTyping) {
            finishTyping();
        } else if (interactionActive) {
            interactionActive = false;
            uiPrompt.style.display = 'none';
            showNextLine();
        }
    } else if (gameState === 'playing' && pendingInteraction) {
        pendingInteraction();
        pendingInteraction = null;
    }
}

function endDialogue() {
    gameState = 'playing';
    uiDialogue.style.display = 'none';
}

// --- START SCREEN ---
const startScreen = document.createElement('div');
startScreen.id = 'start-screen';
startScreen.style.position = 'absolute';
startScreen.style.top = '0';
startScreen.style.left = '0';
startScreen.style.width = '100%';
startScreen.style.height = '100%';
startScreen.style.backgroundColor = '#000';
startScreen.style.display = 'flex';
startScreen.style.flexDirection = 'column';
startScreen.style.justifyContent = 'center';
startScreen.style.alignItems = 'center';
startScreen.style.zIndex = '1000';

const title = document.createElement('h1');
title.innerText = 'NPC ENERGY';
title.style.color = '#f0e68c';
title.style.fontSize = '40px';
title.style.marginBottom = '20px';

const subtitle = document.createElement('p');
subtitle.innerText = 'Chapter 1: The Hallway';
subtitle.style.color = '#fff';
subtitle.style.fontSize = '16px';
subtitle.style.marginBottom = '40px';

const startBtn = document.createElement('button');
startBtn.innerText = 'PRESS START';
startBtn.style.padding = '15px 30px';
startBtn.style.fontSize = '16px';
startBtn.style.fontFamily = "'Press Start 2P', monospace";
startBtn.style.cursor = 'pointer';
startBtn.style.background = '#3498db';
startBtn.style.border = 'none';
startBtn.style.color = 'white';

startBtn.onclick = startGame;

startScreen.appendChild(title);
startScreen.appendChild(subtitle);
startScreen.appendChild(startBtn);
document.getElementById('game-container').appendChild(startScreen);


// --- INIT ---
function startGame() {
    startScreen.style.display = 'none';
    setTimeout(() => document.getElementById('fade-overlay').style.opacity = 0, 500);

    // Initialize Game State
    player.x = 200;
    startDialogue(SCRIPTS.HOME_ARGUMENT);

    gameLoop();
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

</script>
